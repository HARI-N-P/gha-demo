name: wf-for-outputs
on: push
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: step one
        id: step_1
        run: echo "version=1.0.0" >> $GITHUB_OUTPUT
      outputs:
        version: ${{ steps.step_1.outputs.version }}
  deploy-job:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: deploy app
        run: echo "we are deploying the app with above output oof above job version ${{ needs.build-job.outputs.version}} "
       

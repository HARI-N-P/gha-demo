name: if-condition-on-jobs
on:
  push: 
    branches:
      - main
  pull_request: 
      types: 
        - opened
        - synchronize
jobs:
   build:
      runs-on: ubuntu-latest
      # if: github.event_name == 'pull_request'
      if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
      # above condition says only run build job, if PR Raised against MAIN branch, not other feature branches.
      steps:
         - name: build step
           run: echo "building the appli"
   deploy:
     runs-on: ubuntu-latest
     if: github.event_name == 'push'  && github.ref_name == 'main'
     steps:
       - name: deploy step
         run: echo "deploy application"
           
      

name: if-condition-on-jobs
on:
  push: 
    branches:
      - main
  pull_request: 
      types: 
        - opened
        - synchronize
jobs:
   build:
      runs-on: ubuntu-latest
      if: github.event_name == 'pull_request'
      steps:
         - name: build step
           run: echo "building the appli"
   deploy:
     runs-on: ubuntu-latest
     if: github.event_name == 'push'  && github.ref_name == 'main'
     steps:
       - name: deploy step
         run: echo "deploy appli"
           
      

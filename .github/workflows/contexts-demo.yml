name: work-flow-for-context-demo
on: push

jobs:
  job-for-context-demo:
    runs-on: ubuntu-latest
    steps:
      - name: steps-for-context-demo
        run: | 
          echo "wrokflow triggred by ${{ github.actor }}"
          echo "the repo name is ${{ github.repository }}"
          echo "the repo name is ${{ github.ref_name }}"

      - name: print all varibles under github
        run: echo "${{ toJson(github) }}"

      - name: print all enviroment variables
        run: env
      - name: print a particular varible from enviroment variables
        run: |
          echo "$GITHUB_ARTIFACTS"
          echo "$GITHUB_ACTOR_ID"
          echo "$GITHUB_RUN_NUMBER"

name: work-flow-for-context-demo
on: push

jobs:
  job-for-context-demo:
    runs-on: ubuntu-latest
    steps:
      - name: steps-for-context-demo
        run: |
          echo "workflow triggered by ${{ github.actor }}"
          echo "the repo name is ${{ github.repository }}"
          echo "the branch name is ${{ github.ref_name }}"

      - name: print all variables under github
        run: |
          cat << 'EOF'
          ${{ toJSON(github) }}
          EOF

      - name: print all environment variables
        run: env

      - name: print a particular variable from environment variables
        run: |
          echo "$GITHUB_ARTIFACTS"
          echo "$GITHUB_ACTOR_ID"
          echo "$GITHUB_RUN_NUMBER"

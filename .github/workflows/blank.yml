name: Actions Demo in workflow actions
on: push #  tells how gha triggers
jobs:
  actions_demo:      # job name
    runs-on: ubuntu-latest  # on which compute or vm work flow runs
    steps:
      - name: checkout the code   # step name
        uses: actions/checkout@v7
      - name: print index.html file using ACTIONS in workflow
        run: cat index.html

name: hello-world # name of work-flow
on: workflow_dispatch #  tells how gha triggers
jobs:
  hello:      # job name
    runs-on: ubuntu-latest  # on which compute or vm work flow runs
    steps:
      - name: hello step     # step name
        run: |         #"pipe symbol will tell to run multiple shell command at a time"
         echo  "This is line one"
         echo  "This is line two"
        
        

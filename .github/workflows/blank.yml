name: hello-world # name of work-flow
on: workflow_dispatch #  tells how gha triggers
jobs:
  builds:      # job name, job 1
    runs-on: ubuntu-latest  # on which compute or vm work flow runs
    steps:
      - name: build step    # step name
        run: echo "A build demo"

  test:    # job 2
    runs-on: ubuntu-latest
    steps:
      - name: Test phase
        run: echo "Running test case"

  deploy: # job 3
    runs-on: ubuntu-latest
    steps:
      - name: deploy the app
        run: echo "deply app"
